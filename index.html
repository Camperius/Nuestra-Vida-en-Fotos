<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nuestro Álbum Privado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Work+Sans:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1C2430;
  --parchment:#F6F1E7;
  --parchment-2:#EFE7D6;
  --rose:#C97B84;
  --warmgray:#8A8378;
  --paper-line:#DCD2BC;
  --shadow: 0 10px 30px rgba(28,36,48,.18);
  --radius: 3px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; height:100%; width:100%; background:#11151b; overflow:hidden;}
body{ font-family:'Work Sans', sans-serif; color:var(--ink); }
.display{font-family:'Fraunces', serif;}
.script{font-family:'Caveat', cursive;}

#lockScreen{
  position:fixed; inset:0; background:#11151b; z-index:999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:var(--parchment); text-align:center; padding:20px;
}
#lockScreen h2{ font-family:'Fraunces', serif; font-size:24px; margin-bottom:8px; }
#lockScreen p{ font-size:12px; color:var(--warmgray); margin-bottom:16px; }
#lockScreen input{
  padding:10px 16px; font-size:18px; letter-spacing:4px; text-align:center;
  border-radius:20px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.05);
  color:#fff; width:180px; margin-bottom:12px; outline:none;
}
#lockScreen button{
  padding:8px 24px; border-radius:20px; border:none; background:var(--rose); color:#fff;
  font-weight:600; cursor:pointer; font-size:13px;
}

#stage{ height:100%; width:100%; display:flex; justify-content:center; align-items:center; position:relative; }
#book{ position:relative; width:100%; max-width:760px; height:100%; max-height:480px; background:var(--parchment); box-shadow:var(--shadow); overflow:hidden; }
#pagesContainer{ height:100%; width:100%; overflow:hidden; position:relative; }
#pages{ height:100%; display:flex; flex-direction:row; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }

.page{
  height:100%; width:100%; flex:0 0 100%;
  position:relative; display:flex; flex-direction:column; padding:18px 20px 42px; background:var(--parchment); border-right:1px solid rgba(0,0,0,.05);
  box-sizing: border-box;
}

.bottom-nav{
  position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:12px; z-index:42;
  background:rgba(28,36,48,.85); backdrop-filter:blur(6px);
  padding:4px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.15);
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.navbtn{
  width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.15);
  color:#fff; border:none; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:background .15s;
}
.navbtn:active{ background:var(--rose); }

.page.themed{ background: var(--a); color:#fff; }

.page::before{ content:""; position:absolute; inset:0; background-image: radial-gradient(rgba(0,0,0,.045) 1px, transparent 1px); background-size: 3.5px 3.5px; pointer-events:none; opacity:.68; }
.page::after{ content:""; position:absolute; inset:0; background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.028) 0 1px, transparent 1px 4px); pointer-events:none; opacity:.55; }

#tabs{ position:absolute; right:0; top:35px; display:flex; flex-direction:column; gap:5px; z-index:40; align-items:flex-end; }
.tab{ position:relative; height:28px; width:14px; overflow:hidden; border-radius:5px 0 0 5px; cursor:pointer; box-shadow: -2px 3px 8px rgba(0,0,0,.22); background:var(--tabcolor, var(--rose)); display:flex; align-items:center; user-select:none; transition: width .22s cubic-bezier(0.4, 0, 0.2, 1), max-width .22s cubic-bezier(0.4, 0, 0.2, 1); max-width: 14px; }
.tab .tab-label{ padding:0 10px 0 8px; font-size:10px; font-weight:600; color:#fff; white-space:nowrap; opacity:0; transition: opacity .15s ease; }
.tab:hover, .tab:active{ width:auto; max-width:200px; }
.tab:hover .tab-label, .tab:active .tab-label{ opacity:1; }

.cover{ align-items:center; justify-content:center; text-align:center; background: #1C2430; color:var(--parchment); gap:8px; flex-direction:row; padding:15px 25px 42px; }
.cover-left{ width:45%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.cover-right{ width:55%; height:100%; display:flex; justify-content:center; align-items:center; }
.cover-frame{ width:92%; height:88%; border:1px solid rgba(246,241,231,.35); padding:5px; position:relative; }
.cover-photo-slot{ width:100%; height:100%; background:rgba(246,241,231,.06); border:1px dashed rgba(246,241,231,.4); display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; cursor:pointer; }
.cover-photo-slot img, .cover-photo-slot video{width:100%; height:100%; object-fit:cover;}
.cover-photo-slot .hint{font-size:10px; color:rgba(246,241,231,.6); padding:6px; text-align:center;}
.cover h1{ font-size:24px; font-weight:600; margin:2px 0 0px; line-height:1.05; outline:none; }
.cover .names{font-family:'Caveat', cursive; font-size:20px; color:var(--rose); outline:none; margin-bottom: 4px;}

.days-counter{ font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: rgba(246,241,231,.75); background: rgba(255,255,255,.08); padding: 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15); }

.dedication{ align-items:center; justify-content:center; text-align:center; background: var(--parchment-2); gap:10px; flex-direction:row; padding:15px 25px 42px; }
.dedication-left{ width:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.dedication-right{ width:50%; height:100%; display:flex; align-items:center; justify-content:center; }
.dedication .mark{font-size:20px; color:var(--rose);}
.dedication p{ font-family:'Caveat', cursive; font-size:16px; line-height:1.2; color:var(--ink); outline:none; max-width: 95%; margin:0; }
.dedication-frame{ width:92%; height:82%; border:1px solid rgba(28,36,48,.2); padding:4px; background:#fff; position:relative; }
.dedication-slot{ width:100%; height:100%; border:1px dashed var(--warmgray); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; position:relative; }
.dedication-slot img, .dedication-slot video{ width:100%; height:100%; object-fit:cover; }

.index-page{ justify-content:flex-start; }
.index-page h2{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--warmgray); margin:0 0 2px; }
.index-page .idx-title{ font-family:'Fraunces', serif; font-size:20px; margin:0 0 6px; }
.idx-list{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; flex:1; overflow-y:auto; }
.idx-row{ display:flex; align-items:center; gap:6px; padding:6px 2px; border-bottom:1px solid var(--paper-line); cursor:pointer; }
.idx-row .dot{width:7px; height:7px; border-radius:50%; background:var(--c); flex-shrink:0;}
.idx-row .name{flex:1; font-size:12px; font-weight:500;}
.idx-row .count{font-size:9px; color:var(--warmgray);}
.idx-add{margin-top:6px; align-self:flex-start; background:none; border:1px dashed var(--warmgray); color:var(--warmgray); font-size:10px; padding:4px 10px; border-radius:16px; cursor:pointer;}

.sec-page{ padding-top:16px; }
.sec-eyebrow{font-size:9.5px; letter-spacing:.2em; text-transform:uppercase; opacity:.85; display:flex; align-items:center; gap:6px; position:relative; z-index:2;}

.decor-container{ position:absolute; inset:0; pointer-events:none; z-index:0; }
.decor-item{ position:absolute; opacity:.15; color:#fff; }
.dp-1{ top:15px; right:35px; width:22px; height:22px; }
.dp-2{ top:20px; left:20px; width:18px; height:18px; }

.grid{ display:grid; gap:5px; flex:1; min-height:0; position:relative; z-index:2; margin-top:4px; }
.grid.layout-4a{ grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; }
.grid.layout-4b{ grid-template-columns:1fr 1fr 1.2fr; grid-template-rows:1fr 1fr; }
.grid.layout-4b .note-box{ grid-column:3; grid-row:1/3; }
.grid.layout-5a{ grid-template-columns:1.2fr 1fr 1fr; grid-template-rows:1fr 1fr; }
.grid.layout-5a .slot-wrap:nth-child(1){ grid-column:1; grid-row:1/3; }
.grid.layout-6a{ grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr; }

.slot-wrap{ display:flex; flex-direction:column; gap:2px; position:relative; height:100%; min-height:0; }
.slot{ flex:1; position:relative; background:rgba(255,255,255,.08); border:1.5px dashed rgba(255,255,255,.45); border-radius:var(--radius); overflow:hidden; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.slot.filled{ border-style:solid; }
.slot img, .slot video{width:100%; height:100%; object-fit:cover; display:block;}
.slot .empty-hint{ text-align:center; font-size:8px; opacity:.85; }

.remove{ position:absolute; top:3px; right:3px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,.65); color:#fff; border:none; font-size:10px; line-height:18px; text-align:center; cursor:pointer; z-index:10; }
.slot-tools{ display:flex; align-items:center; justify-content:space-between; gap:2px; font-size:8.5px; opacity:.85; }
.slot-meta{ flex:1; outline:none; text-align:center; border-bottom:1px dashed transparent; min-height:10px; white-space:nowrap; overflow:hidden; }

.audio-controls{ display:flex; align-items:center; gap:2px; }
.tool-btn{ background:none; border:none; color:#fff; font-size:10px; cursor:pointer; padding:1px; opacity:.85; }
.tool-btn.recording{ background:#e74c3c; color:#fff; font-size:7.5px; padding:1px 3px; border-radius:3px; }

.note-box{ background: rgba(255,255,255,.14); border: 1px dashed rgba(255,255,255,.5); border-radius: var(--radius); padding: 5px 6px; display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
.note-box .note-title{ font-size: 8px; text-transform: uppercase; letter-spacing: .1em; opacity: .8; font-weight:600; }
.note-box .note-content{ font-family: 'Caveat', cursive; font-size: 14px; line-height: 1.1; flex: 1; outline: none; color: #fff; overflow-y: auto; }

.sec-quote{ font-family:'Caveat', cursive; font-size:15px; line-height:1.1; margin-top:2px; outline:none; min-height:16px; position:relative; z-index:2; }
.sec-controls{ display:flex; justify-content:space-between; align-items:center; margin-top:2px; font-size:9px; opacity:.85; position:relative; z-index:2; }
.sec-controls button{ background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:inherit; font-size:9px; padding:2px 6px; border-radius:14px; cursor:pointer; }

.fav-btn{ position:absolute; top:6px; right:8px; z-index:10; background:none; border:none; font-size:16px; cursor:pointer; color:#fff; }

.new-sec-page{ align-items:center; justify-content:center; gap:8px; text-align:center; }
.new-sec-page input{ width:60%; padding:6px 8px; border-radius:6px; border:1px solid var(--paper-line); font-size:11px; background:#fff; }
.swatches{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; width:70%;}
.swatch{width:18px; height:18px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.swatch.sel{border-color:var(--ink); transform:scale(1.15);}
.new-sec-page button.primary{ background:var(--ink); color:#fff; border:none; padding:6px 14px; border-radius:16px; font-weight:500; cursor:pointer; font-size:10px; }

#quickMenu{ position:absolute; top:6px; left:10px; z-index:45; display:flex; gap:4px; }
.menu-btn{ background:rgba(28,36,48,.6); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:10px; padding:2px 6px; font-size:8.5px; cursor:pointer; }

#syncStatus{ position:fixed; bottom:10px; right:12px; z-index:100; font-size:9px; color:rgba(255,255,255,.6); background:rgba(0,0,0,.5); padding:3px 8px; border-radius:10px; backdrop-filter:blur(4px); }

#lightbox{ position:fixed; inset:0; background:rgba(10,12,16,.95); z-index:200; display:none; align-items:center; justify-content:center; flex-direction:column; }
#lightbox.show{display:flex;}
#lightbox .lb-media{ max-width:92vw; max-height:80vh; display:flex; align-items:center; justify-content:center; }
#lightbox img, #lightbox video{ max-width:92vw; max-height:80vh; object-fit:contain; border-radius:4px; }
#lightbox .lb-close{ position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:16px; cursor:pointer; }
#lightbox .lb-nav{ position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.15); color:#fff; border:none; font-size:20px; cursor:pointer; z-index:210; }
#lightbox .lb-prev{left:10px;} #lightbox .lb-next{right:10px;}

input[type=file]{display:none;}
</style>
</head>
<body>

<div id="lockScreen">
  <h2>🔒 Álbum Privado</h2>
  <p>Ingresa la contraseña para ver los recuerdos</p>
  <input type="password" id="pinInput" placeholder="••••" maxlength="8">
  <button id="unlockBtn">Entrar</button>
</div>

<div id="stage">
  <div id="book">
    <div id="quickMenu">
      <button class="menu-btn" id="printBtn">🖨 PDF</button>
    </div>
    <div id="tabs"></div>
    
    <div class="bottom-nav">
      <button class="navbtn" id="prevBtn">‹</button>
      <button class="navbtn" id="nextBtn">›</button>
    </div>

    <div id="pagesContainer">
      <div id="pages"></div>
    </div>
  </div>
</div>

<div id="syncStatus">☁️ Conectando...</div>
<input type="file" id="fileInput" accept="image/*">

<div id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <div class="lb-media" id="lbMedia"></div>
  <button class="lb-nav lb-next" id="lbNext">›</button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAIOuBHUUr_zA2uByWy24miiAVUqa-AXJQ",
    authDomain: "nuestra-vida-ed814.firebaseapp.com",
    projectId: "nuestra-vida-ed814",
    messagingSenderId: "860222240723",
    appId: "1:860222240723:web:84f085cfa5cda127e46126"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const SECRET_PIN = "2811";
  const docRef = doc(db, "albumData", "sharedAlbum");

  let currentPageIdx = 0;
  let isEditing = false;
  const lockScreen = document.getElementById('lockScreen');
  const pinInput = document.getElementById('pinInput');
  const unlockBtn = document.getElementById('unlockBtn');

  function checkPin(){
    if(pinInput.value === SECRET_PIN || localStorage.getItem('unlocked') === 'true'){
      localStorage.setItem('unlocked', 'true');
      lockScreen.style.display = 'none';
      initFirebaseSync();
    } else {
      alert("PIN incorrecto");
    }
  }

  unlockBtn.onclick = checkPin;
  if(localStorage.getItem('unlocked') === 'true'){
    lockScreen.style.display = 'none';
    initFirebaseSync();
  }

  const BASE_CATEGORIES = [
    {id:'vac', name:'Vacaciones', colorA:'#2A6F77', icon:'✈'},
    {id:'com', name:'Comida',     colorA:'#C1552C', icon:'✦'},
    {id:'hal', name:'Halloween',  colorA:'#3D2352', icon:'☾'},
    {id:'nav', name:'Navidad',    colorA:'#1F4B3F', icon:'❋'},
    {id:'ani', name:'Animales',   colorA:'#6B7A3A', icon:'❁'},
    {id:'lug', name:'Lugares',    colorA:'#3A5A78', icon:'⚑'},
  ];

  const EXPANDED_PALETTE = ['#2A6F77', '#C1552C', '#3D2352', '#1F4B3F', '#6B7A3A', '#3A5A78', '#C97B84', '#D9822B', '#2E86AB', '#705238', '#8E44AD', '#16A085'];
  const DECOR_ICONS = {
    vac: ['<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="16" fill="none" stroke="currentColor" stroke-width="2"/><line x1="40" y1="10" x2="40" y2="18" stroke="currentColor" stroke-width="2"/><line x1="40" y1="62" x2="40" y2="70" stroke="currentColor" stroke-width="2"/><line x1="10" y1="40" x2="18" y2="40" stroke="currentColor" stroke-width="2"/><line x1="62" y1="40" x2="70" y2="40" stroke="currentColor" stroke-width="2"/></svg>'],
    com: ['<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="20" fill="none" stroke="currentColor" stroke-width="2"/></svg>'],
    hal: ['<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="10" fill="none" stroke="currentColor" stroke-width="2"/></svg>'],
    nav: ['<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="8" fill="currentColor"/></svg>'],
    ani: ['<svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="6" fill="currentColor"/></svg>'],
    lug: ['<svg viewBox="0 0 80 80"><circle cx="40" cy="28" r="6" fill="currentColor"/></svg>']
  };

  const LAYOUT_VARIANTS = ['layout-5a', 'layout-4b', 'layout-6a', 'layout-4a'];
  const LAYOUT_COUNTS = { 'layout-4a':4, 'layout-4b':4, 'layout-5a':5, 'layout-6a':6 };

  function getDaysTogether(){
    const start = new Date("2025-11-28T00:00:00");
    const now = new Date();
    return Math.floor(Math.abs(now - start) / (1000 * 60 * 60 * 24));
  }

  function defaultState(){
    const categories = BASE_CATEGORIES.map(c=>({...c}));
    return {
      cover: { title:"Nuestro Álbum", names:"Fernando & Melanie", photo:null },
      dedication: { text:"Para quien esto lea algún día: cada foto de aquí es un momento en el que elegimos estar juntos.", photo:null, sign:"— con amor" },
      categories,
      pages: categories.map((c,i)=> mkPage(c.id, c.name, LAYOUT_VARIANTS[i % LAYOUT_VARIANTS.length]))
    };
  }

  function mkPage(categoryId, name, layoutId){
    const validLayout = LAYOUT_VARIANTS.includes(layoutId) ? layoutId : 'layout-4a';
    return { 
      id: Math.random().toString(36).slice(2,10), 
      categoryId, name, layout: validLayout, quote:"", noteText:"", favorite:false,
      slots: Array.from({length:LAYOUT_COUNTS[validLayout]}, ()=>({type:null, data:null, meta:"", audioNote:null})) 
    };
  }

  let state = defaultState();
  let activeSlotTarget = null;
  let currentLbState = { pageId:null, filledSlots:[], index:0 };

  const pagesEl = document.getElementById('pages');
  const tabsEl = document.getElementById('tabs');
  const syncStatus = document.getElementById('syncStatus');

  async function saveCloud(){
    isEditing = true;
    syncStatus.textContent = '☁️ Guardando...';
    try {
      const payload = JSON.stringify(state);
      await setDoc(docRef, { data: payload });
      syncStatus.textContent = '☁️ Sincronizado';
    } catch (err) {
      console.error("Error guardando en Firestore:", err);
      syncStatus.textContent = '⚠️ Error: Foto muy pesada';
    } finally {
      setTimeout(() => { isEditing = false; }, 1500);
    }
  }

  function initFirebaseSync(){
    onSnapshot(docRef, (docSnap)=>{
      if(isEditing) return;
      if(docSnap.exists()){
        const rawData = docSnap.data().data;
        if(rawData && rawData !== "{}" && rawData.trim() !== ""){
          try { 
            state = JSON.parse(rawData); 
          } catch(e){
            state = defaultState();
          }
        } else {
          state = defaultState();
        }
        render();
        syncStatus.textContent = '☁️ Sincronizado';
      } else {
        saveCloud();
      }
    });
  }

  function allPageDescriptors(){
    const descriptors = [{kind:'cover'}, {kind:'dedication'}, {kind:'index'}];
    if(state && state.pages){
      state.pages.forEach(p=> descriptors.push({kind:'page', pageId:p.id}));
    }
    descriptors.push({kind:'newcat'});
    return descriptors;
  }

  function render(){
    pagesEl.innerHTML = '';
    allPageDescriptors().forEach(d=>{
      let el;
      if(d.kind==='cover') el = renderCover();
      else if(d.kind==='dedication') el = renderDedication();
      else if(d.kind==='index') el = renderIndex();
      else if(d.kind==='newcat') el = renderNewCategoryPage();
      else el = renderPage(d.pageId);
      pagesEl.appendChild(el);
    });
    renderTabs();
    goToPageIndex(currentPageIdx);
  }

  function editable(tag, cls, text, onInput, placeholder){
    const el = document.createElement(tag);
    el.className = cls; el.contentEditable = 'true'; el.spellcheck = false;
    el.textContent = text || '';
    if(!text && placeholder){ el.textContent = placeholder; el.style.opacity=.55; }
    el.addEventListener('focus', ()=>{ if(el.textContent===placeholder){ el.textContent=''; el.style.opacity=1; } });
    el.addEventListener('blur', ()=>{
      if(el.textContent.trim()===''){ if(placeholder){ el.textContent=placeholder; el.style.opacity=.55; } onInput(''); }
      else { onInput(el.textContent.trim()); }
    });
    return el;
  }

  function renderCover(){
    const page = document.createElement('div'); page.className = 'page cover';
    const left = document.createElement('div'); left.className = 'cover-left';
    const title = editable('h1','display', state.cover.title, v=>{state.cover.title=v||'Nuestro Álbum'; saveCloud();});
    const names = editable('div','names', state.cover.names, v=>{state.cover.names=v; saveCloud();}, 'Nombres');
    const daysCounter = document.createElement('div'); daysCounter.className = 'days-counter'; daysCounter.textContent = `♥ ${getDaysTogether()} días juntos ♥`;
    left.appendChild(title); left.appendChild(names); left.appendChild(daysCounter);

    const right = document.createElement('div'); right.className = 'cover-right';
    const frame = document.createElement('div'); frame.className='cover-frame';
    const slot = document.createElement('div'); slot.className='cover-photo-slot';
    
    if(state.cover.photo){
      const elMedia = document.createElement('img');
      elMedia.src = state.cover.photo.data; slot.appendChild(elMedia);
      const rm = document.createElement('button'); rm.className='remove'; rm.textContent='✕';
      rm.onclick = (e)=>{ e.stopPropagation(); state.cover.photo = null; render(); saveCloud(); };
      slot.appendChild(rm);
    } else {
      slot.innerHTML = '<div class="hint">Toca para subir foto principal</div>';
      slot.onclick = ()=>{ activeSlotTarget='cover'; document.getElementById('fileInput').click(); };
    }

    frame.appendChild(slot); right.appendChild(frame);
    page.appendChild(left); page.appendChild(right);
    return page;
  }

  function renderDedication(){
    const page = document.createElement('div'); page.className = 'page dedication';
    const left = document.createElement('div'); left.className = 'dedication-left';
    const mark = document.createElement('div'); mark.className='mark'; mark.textContent='❦';
    const p = editable('p','script', state.dedication.text, v=>{state.dedication.text=v; saveCloud();}, 'Dedicatoria…');
    const sign = editable('div','sign script', state.dedication.sign, v=>{state.dedication.sign=v; saveCloud();}, '— firma');
    left.appendChild(mark); left.appendChild(p); left.appendChild(sign);

    const right = document.createElement('div'); right.className = 'dedication-right';
    const frame = document.createElement('div'); frame.className='dedication-frame';
    const slot = document.createElement('div'); slot.className='dedication-slot';
    
    if(state.dedication.photo){
      const elMedia = document.createElement('img');
      elMedia.src = state.dedication.photo.data; slot.appendChild(elMedia);
      const rm = document.createElement('button'); rm.className='remove'; rm.textContent='✕';
      rm.onclick = (e)=>{ e.stopPropagation(); state.dedication.photo = null; render(); saveCloud(); };
      slot.appendChild(rm);
    } else {
      slot.innerHTML = '<span style="font-size:10px; color:#888;">+ Toca foto dedicatoria</span>';
      slot.onclick = ()=>{ activeSlotTarget='dedication'; document.getElementById('fileInput').click(); };
    }

    frame.appendChild(slot); right.appendChild(frame);
    page.appendChild(left); page.appendChild(right);
    return page;
  }

  function renderIndex(){
    const page = document.createElement('div'); page.className = 'page index-page';
    page.innerHTML = '<h2>Contenido</h2><div class="idx-title display">Índice</div>';
    const list = document.createElement('div'); list.className='idx-list';

    if(state && state.categories){
      state.categories.forEach(cat=>{
        const catPages = state.pages ? state.pages.filter(p=>p.categoryId===cat.id) : [];
        if(catPages.length > 0) {
          const row = document.createElement('div'); row.className='idx-row';
          row.innerHTML = `<span class="dot" style="--c:${cat.colorA}"></span><span class="name">${cat.name}</span><span class="count">${catPages.length} pág</span>`;
          row.onclick = ()=>{
            const fp = state.pages.find(p=>p.categoryId===cat.id);
            if(fp) scrollToPageId(fp.id);
          };
          list.appendChild(row);
        }
      });
    }

    const addCatBtn = document.createElement('button'); addCatBtn.className='idx-add'; addCatBtn.textContent='+ Nueva sección';
    addCatBtn.onclick = ()=> goToPageIndex(allPageDescriptors().length - 1);
    page.appendChild(list); page.appendChild(addCatBtn);
    return page;
  }

  function renderPage(pageId){
    const page = state.pages.find(p=>p.id===pageId);
    if(!page) return document.createElement('div');

    const cat = state.categories.find(c=>c.id===page.categoryId) || BASE_CATEGORIES[0];
    const el = document.createElement('div'); el.className = 'page themed sec-page'; el.style.setProperty('--a', cat.colorA);

    const favBtn = document.createElement('button'); favBtn.className='fav-btn';
    favBtn.textContent = page.favorite ? '♥' : '♡';
    favBtn.onclick = ()=>{ page.favorite = !page.favorite; saveCloud(); render(); };
    el.appendChild(favBtn);

    const decorContainer = document.createElement('div'); decorContainer.className='decor-container';
    let icons = DECOR_ICONS[cat.id] || DECOR_ICONS.vac;
    for(let i=1; i<=2; i++){
      const d = document.createElement('div'); d.className = `decor-item dp-${i}`; d.innerHTML = icons[0];
      decorContainer.appendChild(d);
    }
    el.appendChild(decorContainer);

    const eyebrow = document.createElement('div'); eyebrow.className='sec-eyebrow';
    eyebrow.innerHTML = `<span>${cat.icon}</span> <span>${page.name}</span>`;
    el.appendChild(eyebrow);

    const currentLayout = LAYOUT_VARIANTS.includes(page.layout) ? page.layout : 'layout-4a';
    const grid = document.createElement('div'); grid.className = 'grid ' + currentLayout;
    
    page.slots.forEach((sl, idx)=>{
      const wrap = document.createElement('div'); wrap.className='slot-wrap';
      const slotEl = document.createElement('div'); slotEl.className='slot'+(sl.data?' filled':'');
      
      if(sl.data){
        const elMedia = document.createElement('img');
        elMedia.src=sl.data; slotEl.appendChild(elMedia);
        const rm = document.createElement('button'); rm.className='remove'; rm.textContent='✕';
        rm.onclick = (e)=>{ e.stopPropagation(); sl.data=null; render(); saveCloud(); };
        slotEl.appendChild(rm);
        slotEl.onclick = ()=> openLightbox(pageId, idx);
      } else {
        slotEl.innerHTML = '<div class="empty-hint">+ foto</div>';
        slotEl.onclick = ()=>{ activeSlotTarget={pageId, slotIndex:idx}; document.getElementById('fileInput').click(); };
      }

      const toolsLine = document.createElement('div'); toolsLine.className = 'slot-tools';
      const metaLine = editable('div','slot-meta', sl.meta, v=>{ sl.meta=v; saveCloud(); }, 'Detalle…');

      toolsLine.appendChild(metaLine);
      wrap.appendChild(slotEl); wrap.appendChild(toolsLine);
      grid.appendChild(wrap);
    });

    if(currentLayout === 'layout-4b'){
      const noteBox = document.createElement('div'); noteBox.className = 'note-box';
      const noteTitle = document.createElement('div'); noteTitle.className = 'note-title'; noteTitle.textContent = '📝 Nota especial';
      const noteContent = editable('div', 'note-content', page.noteText, v=>{ page.noteText = v; saveCloud(); }, 'Escribe momentos aquí…');
      noteBox.appendChild(noteTitle); noteBox.appendChild(noteContent);
      grid.appendChild(noteBox);
    }

    el.appendChild(grid);
    const quote = editable('div','sec-quote script', page.quote, v=>{page.quote=v; saveCloud();}, 'Pensamiento de este momento…');
    el.appendChild(quote);

    const controls = document.createElement('div'); controls.className='sec-controls';
    const addBtn = document.createElement('button'); addBtn.textContent='+ Agregar hoja';
    addBtn.onclick = ()=>{
      const currentIdx = LAYOUT_VARIANTS.indexOf(page.layout);
      const nextLayout = LAYOUT_VARIANTS[(currentIdx + 1) % LAYOUT_VARIANTS.length];
      const np = mkPage(page.categoryId, cat.name, nextLayout);
      state.pages.splice(state.pages.indexOf(page)+1, 0, np);
      saveCloud(); render(); scrollToPageId(np.id);
    };

    const delBtn = document.createElement('button'); delBtn.textContent='🗑 Eliminar';
    delBtn.onclick = ()=>{
      const idx = state.pages.indexOf(page);
      const prevPage = idx > 0 ? state.pages[idx - 1] : null;
      state.pages.splice(idx, 1);
      saveCloud(); render();
      if(prevPage) scrollToPageId(prevPage.id);
      else goToPageIndex(2);
    };

    controls.appendChild(addBtn); controls.appendChild(delBtn);
    el.appendChild(controls);
    return el;
  }

  function renderNewCategoryPage(){
    const page = document.createElement('div'); page.className = 'page new-sec-page';
    page.innerHTML = '<div class="display" style="font-size:18px;">Añadir una sección</div>';
    const input = document.createElement('input'); input.placeholder = 'Nombre (ej. Conciertos…)';
    const swatches = document.createElement('div'); swatches.className = 'swatches';
    let selectedColor = EXPANDED_PALETTE[0];

    EXPANDED_PALETTE.forEach((color, i)=>{
      const sw = document.createElement('div'); sw.className = 'swatch' + (i===0?' sel':'');
      sw.style.background = color;
      sw.onclick = ()=>{
        swatches.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));
        sw.classList.add('sel'); selectedColor = color;
      };
      swatches.appendChild(sw);
    });

    const btn = document.createElement('button'); btn.className = 'primary'; btn.textContent = 'Crear sección';
    btn.onclick = ()=>{
      const name = input.value.trim();
      if(!name) return;
      const newCat = { id: Math.random().toString(36).slice(2,8), name, colorA: selectedColor, icon: '✦' };
      state.categories.push(newCat);
      const np = mkPage(newCat.id, name, 'layout-4a');
      state.pages.push(np);
      saveCloud(); render(); scrollToPageId(np.id);
    };

    page.appendChild(input); page.appendChild(swatches); page.appendChild(btn);
    return page;
  }

  // COMPRESOR REFORZADO POR CANVAS (Garantiza fotos super livianas < 30KB)
  function compressFile(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const canvas = document.createElement('canvas');
        let maxW = 400;
        let scale = maxW / img.width;
        if(scale > 1) scale = 1;
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.35));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  async function handleFile(file){
    if(!file) return;
    syncStatus.textContent = '☁️ Procesando...';
    try {
      const compressedDataUrl = await compressFile(file);
      if(activeSlotTarget==='cover') state.cover.photo = {type:'image', data: compressedDataUrl};
      else if(activeSlotTarget==='dedication') state.dedication.photo = {type:'image', data: compressedDataUrl};
      else if(activeSlotTarget){
        const {pageId, slotIndex} = activeSlotTarget;
        const p = state.pages.find(p=>p.id===pageId);
        if(p && p.slots[slotIndex]) { p.slots[slotIndex].type = 'image'; p.slots[slotIndex].data = compressedDataUrl; }
      }
      activeSlotTarget = null;
      render();
      await saveCloud();
    } catch(e) {
      console.error(e);
      syncStatus.textContent = '⚠️ Error procesando la foto';
    }
  }

  document.getElementById('fileInput').onchange = e=> handleFile(e.target.files[0]);

  document.getElementById('printBtn').onclick = ()=> window.print();

  function renderTabs(){
    tabsEl.innerHTML='';
    const indexTab = document.createElement('div'); indexTab.className = 'tab';
    indexTab.style.setProperty('--tabcolor', '#1C2430');
    indexTab.innerHTML = '<span class="tab-label">📖 Índice</span>';
    indexTab.onclick = ()=> goToPageIndex(2);
    tabsEl.appendChild(indexTab);

    if(state && state.categories){
      state.categories.forEach(cat=>{
        const count = state.pages ? state.pages.filter(p=>p.categoryId===cat.id).length : 0;
        if(count > 0) {
          const t = document.createElement('div'); t.className='tab';
          t.style.setProperty('--tabcolor', cat.colorA);
          t.innerHTML = `<span class="tab-label">${cat.name} · ${count}</span>`;
          t.onclick = ()=>{
            const fp = state.pages.find(p=>p.categoryId===cat.id);
            if(fp) scrollToPageId(fp.id);
          };
          tabsEl.appendChild(t);
        }
      });
    }
  }

  function scrollToPageId(id){
    const idx = state.pages.findIndex(p=>p.id===id);
    if(idx>=0) goToPageIndex(idx+3);
  }

  function goToPageIndex(idx){
    const total = allPageDescriptors().length;
    if(idx < 0) idx = 0;
    if(idx >= total) idx = total - 1;
    currentPageIdx = idx;
    pagesEl.style.transform = `translateX(-${idx * 100}%)`;
  }

  document.getElementById('prevBtn').onclick = ()=> goToPageIndex(currentPageIdx - 1);
  document.getElementById('nextBtn').onclick = ()=> goToPageIndex(currentPageIdx + 1);

  function openLightbox(pageId, slotIndex){
    const page = state.pages.find(p=>p.id===pageId);
    if(!page) return;
    const filledSlots = page.slots.filter(s=>s.data);
    if(filledSlots.length === 0) return;
    const filledIdx = filledSlots.indexOf(page.slots[slotIndex]);
    currentLbState = { pageId, filledSlots, index: filledIdx >= 0 ? filledIdx : 0 };
    renderLightboxMedia();
    document.getElementById('lightbox').classList.add('show');
  }

  function renderLightboxMedia(){
    const { filledSlots, index } = currentLbState;
    const slot = filledSlots[index];
    const container = document.getElementById('lbMedia'); container.innerHTML = '';
    const elMedia = document.createElement('img');
    elMedia.src = slot.data;
    container.appendChild(elMedia);
  }

  document.getElementById('lbClose').onclick = ()=> document.getElementById('lightbox').classList.remove('show');
  document.getElementById('lbPrev').onclick = ()=>{
    if(currentLbState.filledSlots.length > 0){
      currentLbState.index = (currentLbState.index - 1 + currentLbState.filledSlots.length) % currentLbState.filledSlots.length;
      renderLightboxMedia();
    }
  };
  document.getElementById('lbNext').onclick = ()=>{
    if(currentLbState.filledSlots.length > 0){
      currentLbState.index = (currentLbState.index + 1) % currentLbState.filledSlots.length;
      renderLightboxMedia();
    }
  };
</script>
